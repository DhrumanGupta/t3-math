name: T3 Math probe

# Temporary: finds which commits the workflow token may tag.

on:
  workflow_dispatch:
    inputs:
      shas:
        description: "Space-separated label=sha pairs"
        required: true
        type: string

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHAS: ${{ inputs.shas }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.T3_MATH_DEPLOY_KEY }}
          sparse-checkout: .github
      - name: Probe
        shell: bash
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          for pair in $SHAS; do
            label="${pair%%=*}"; sha="${pair#*=}"
            tag="zz-probe-key-$label-$GITHUB_RUN_ID"
            git fetch --quiet --depth=1 origin "$sha"
            git tag "$tag" "$sha"
            if git push origin "refs/tags/$tag"; then
              echo "RESULT keypush $label $sha OK"
            else
              echo "RESULT keypush $label $sha FAIL"
              continue
            fi
            if out="$(gh release create "$tag" --verify-tag --prerelease --title "probe" --notes "probe" 2>&1)"; then
              echo "RESULT release $label $sha OK"
              gh release delete "$tag" -y >/dev/null || echo "release delete failed $tag"
            else
              echo "RESULT release $label $sha FAIL: $(tail -n 1 <<< "$out")"
            fi
            git push origin --delete "refs/tags/$tag" || echo "tag delete failed $tag"
          done
