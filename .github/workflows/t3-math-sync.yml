name: T3 Math sync

# Upstream sync every two days. Each track merges its upstream target into its own
# branch, checks the math rendering tests, pushes the branch, and starts
# t3-math-build.yml on it.
#
#   main     -> branch `math`          follows pingdotgg/t3code main
#   nightly  -> branch `math-nightly`  follows the latest upstream nightly tag
#
# The build runs from the pushed branch, so it uses that branch's own copy of
# upstream's packaging workflow. See FORK.md.

on:
  schedule:
    # Daily at 03:17 UTC; the selection step permits alternate UTC epoch days.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      track:
        description: "Track to sync"
        required: false
        default: both
        type: choice
        options:
          - both
          - main
          - nightly
      force:
        description: "Build even when the branch already contains the upstream target"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  sync:
    name: ${{ matrix.track }}
    if: github.repository != 'pingdotgg/t3code'
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: main
            branch: math
          - track: nightly
            branch: math-nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: t3-math-sync-${{ matrix.track }}
      cancel-in-progress: false
    env:
      UPSTREAM_URL: https://github.com/pingdotgg/t3code.git
      TRACK: ${{ matrix.track }}
      BRANCH: ${{ matrix.branch }}
      GH_TOKEN: ${{ github.token }}
      # gh otherwise resolves a fork checkout to its parent repository.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check cadence and track selection
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.track || 'both' }}
        run: |
          set -euo pipefail
          # Epoch days keep the two-day interval across month and year boundaries.
          utc_day=$(( $(date -u +%s) / 86400 ))
          if [[ "$EVENT_NAME" == "schedule" ]] && (( utc_day % 2 != 0 )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$REQUESTED" == "both" || "$REQUESTED" == "$TRACK" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # The deploy key pushes the merge. The workflow token cannot push
      # upstream's changes to .github/workflows.
      - name: Checkout
        if: steps.select.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          ssh-key: ${{ secrets.T3_MATH_DEPLOY_KEY }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve upstream target
        if: steps.select.outputs.run == 'true'
        id: target
        shell: bash
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"

          nightly_tag="$(
            git ls-remote --tags --refs upstream 'v*-nightly.*' |
              sed 's#.*refs/tags/##' |
              sort -V |
              tail -n 1
          )"
          if [[ -z "$nightly_tag" ]]; then
            echo "No upstream nightly tag found." >&2
            exit 1
          fi

          if [[ "$TRACK" == "nightly" ]]; then
            git fetch --no-tags --filter=blob:none upstream "refs/tags/$nightly_tag:refs/tags/$nightly_tag"
            target_sha="$(git rev-parse "$nightly_tag^{commit}")"
            target_label="$nightly_tag"
          else
            git fetch --no-tags --filter=blob:none upstream main
            target_sha="$(git rev-parse FETCH_HEAD)"
            target_label="main@${target_sha:0:9}"
          fi

          # Nightly tags carry the version the next stable will ship as.
          base_version="${nightly_tag#v}"
          base_version="${base_version%%-*}"
          prerelease="preview"
          if [[ "$TRACK" == "nightly" ]]; then
            prerelease="nightly"
          fi
          version="${base_version}-${prerelease}.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"

          previous_sha="$(git merge-base "$target_sha" HEAD)"
          if git merge-base --is-ancestor "$target_sha" HEAD; then
            echo "$BRANCH already contains $target_label."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            echo "build=$FORCE" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "sha=$target_sha"
            echo "label=$target_label"
            echo "version=$version"
            echo "server_version=${nightly_tag#v}"
            echo "previous_sha=$previous_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Merge upstream
        if: steps.target.outputs.merge == 'true'
        id: merge
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_LABEL: ${{ steps.target.outputs.label }}
        run: |
          set -euo pipefail
          echo "lockfile_conflict=false" >> "$GITHUB_OUTPUT"

          # README.md is always the T3 Math header followed by upstream's
          # README, so a conflict there never needs a person.
          write_readme() {
            {
              cat .github/t3-math-readme-header.md
              git show "$TARGET_SHA:README.md"
            } > README.md
            git add README.md
          }

          if git merge --no-edit -m "Merge upstream $TARGET_LABEL into $BRANCH" "$TARGET_SHA"; then
            write_readme
            if ! git diff --cached --quiet; then
              git commit -m "Restore the T3 Math README header"
            fi
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U)"
          unresolved="$(grep -v -x -e README.md -e pnpm-lock.yaml <<< "$conflicts" || true)"
          if [[ -z "$unresolved" ]]; then
            write_readme
            if grep -q -x pnpm-lock.yaml <<< "$conflicts"; then
              # Take upstream's lockfile; the install step adds our packages
              # back and concludes the merge.
              git checkout --theirs pnpm-lock.yaml
              git add pnpm-lock.yaml
              echo "lockfile_conflict=true" >> "$GITHUB_OUTPUT"
            else
              git commit --no-edit
            fi
            exit 0
          fi

          {
            echo "Merging upstream \`$TARGET_LABEL\` into \`$BRANCH\` conflicted in:"
            echo
            echo '```'
            echo "$unresolved"
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Resolve by merging \`$TARGET_SHA\` into \`$BRANCH\` by hand, then rerun the workflow."
          } > "$RUNNER_TEMP/conflict.md"
          title="Upstream merge conflict on $BRANCH"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/conflict.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/conflict.md"
          fi
          exit 1

      - name: Setup Vite+
        if: steps.target.outputs.merge == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        if: steps.target.outputs.merge == 'true'
        shell: bash
        env:
          LOCKFILE_CONFLICT: ${{ steps.merge.outputs.lockfile_conflict }}
        run: |
          set -euo pipefail
          if [[ "$LOCKFILE_CONFLICT" == "true" ]]; then
            vp install --no-frozen-lockfile
            git add pnpm-lock.yaml
            git commit --no-edit
          else
            vp install --filter=@t3tools/web...
          fi

      # Rendering tests run in headless Chromium, like upstream's web tests.
      - name: Install Chromium
        if: steps.target.outputs.merge == 'true'
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Test math rendering
        if: steps.target.outputs.merge == 'true'
        working-directory: apps/web
        run: >-
          vp test run
          src/markdown-clipboard.math.browser.test.ts
          src/components/ChatMarkdown.math.browser.test.tsx

      - name: Test shared math parser
        if: steps.target.outputs.merge == 'true'
        working-directory: packages/shared
        run: vp test run --config ../../vite.config.ts --dir . src/markdownMath.test.ts

      - name: Push branch
        if: steps.target.outputs.merge == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$BRANCH"
          if [[ "$TRACK" == "main" ]]; then
            # Keep this repository's main an untouched upstream mirror.
            git push origin "$TARGET_SHA:refs/heads/main"
          fi

      - name: Start build
        if: steps.target.outputs.build == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
          SERVER_VERSION: ${{ steps.target.outputs.server_version }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_LABEL: ${{ steps.target.outputs.label }}
          PREVIOUS_SHA: ${{ steps.target.outputs.previous_sha }}
        run: |
          gh workflow run t3-math-build.yml \
            --ref "$BRANCH" \
            -f track="$TRACK" \
            -f version="$VERSION" \
            -f server_version="$SERVER_VERSION" \
            -f upstream_label="$TARGET_LABEL" \
            -f upstream_sha="$TARGET_SHA" \
            -f previous_sha="$PREVIOUS_SHA"
